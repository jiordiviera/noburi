name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned to commit SHAs: actions/checkout v7.0.1, voidzero-dev/setup-vp v1.21.2.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          node-version-file: .nvmrc
          cache: true
      # No Claude credentials here: tests use a fake provider and never call Claude.
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  shell:
    name: desktop shell (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned: actions/checkout v7.0.1, Swatinem/rust-cache v2.9.2.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/desktop/src-tauri
      # tauri::generate_context! needs the frontend output folder to exist.
      - run: mkdir -p apps/desktop/dist
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned to commit SHAs: actions/checkout v7.0.1, voidzero-dev/setup-vp v1.21.2.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          node-version-file: .nvmrc
          cache: true
      # No Claude credentials here: tests use a fake provider and never call Claude.
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

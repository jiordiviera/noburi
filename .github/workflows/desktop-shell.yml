name: Desktop shell

# The Rust shell takes minutes to build, so it runs only when the shell or its config changes.
# It is not a required check: pull requests that only touch the website or the runtime skip it.
on:
  pull_request:
    paths:
      - "apps/desktop/src-tauri/**"
      - ".github/workflows/desktop-shell.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/src-tauri/**"
      - ".github/workflows/desktop-shell.yml"

permissions:
  contents: read

concurrency:
  group: desktop-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: desktop shell (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned: actions/checkout v7.0.1, Swatinem/rust-cache v2.9.2.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/desktop/src-tauri
      # tauri::generate_context! needs the frontend output folder to exist.
      - run: mkdir -p apps/desktop/dist
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

[package]
name = "noburi-desktop"
version = "0.1.0"
description = "Noburi desktop shell"
authors = ["Jiordi Kengne and Noburi contributors"]
license = "Apache-2.0"
repository = "https://github.com/jiordiviera/noburi"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "noburi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"
